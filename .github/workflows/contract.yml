name: Live contract

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1"

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked pytest -m live_contract
        env:
          MATRUSP_RUN_LIVE_CONTRACT: "1"
