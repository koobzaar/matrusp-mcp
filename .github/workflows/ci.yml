name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        uv-version: ["0.10.11", "0.12.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ matrix.uv-version }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest --cov=matrusp_mcp --cov-branch
      - run: uv build
      - if: matrix.uv-version == '0.12.5'
        run: docker build --tag matrusp-mcp:test .
